name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Quét secret (repo public — không được có dữ liệu thật)
        run: node scripts/secret-scan.mjs .
      - run: node scripts/lint-skills.mjs
      - run: npm test
      - name: Reference TS + vector (cần type stripping)
        if: matrix.node != 18
        run: npm run test:ts && node bin/aegis.mjs vectors --demo
  dart:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get && dart test
        working-directory: reference/dart
  install:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          AEGIS_SOURCE_DIR: ${{ github.workspace }}
        run: |
          sh install.sh --skills-only
          "$HOME/.aegis/bin/aegis" --version
          test -f "$HOME/.claude/skills/aegis-integrate/SKILL.md"
          test -f "$HOME/.agents/skills/aegis-integrate/SKILL.md"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AEGIS_SOURCE_DIR: ${{ github.workspace }}
        run: |
          ./install.ps1 --skills-only
          & "$HOME\.aegis\bin\aegis.cmd" --version
          if (-not (Test-Path "$HOME\.claude\skills\aegis-integrate\SKILL.md")) { exit 1 }
